[package]
name = "engine-kernels"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hot simulation kernels for the OpenFront engine, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
